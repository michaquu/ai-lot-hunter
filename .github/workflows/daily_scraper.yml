name: Daily Copart & IAAI Challenger Scraper

on:
  schedule:
    # Uruchamia się codziennie o 08:00 UTC (09:00 zimą / 10:00 latem czasu polskiego)
    - cron: "0 8 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb uruchomienia"
        required: true
        default: "analyze"
        type: choice
        options:
          - analyze
          - mark_existing_seen
          - test_telegram
      limit:
        description: "Maksymalna liczba najnowszych aut na serwis"
        required: true
        default: "10"
        type: string

permissions:
  contents: write

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium & Xvfb virtual display
        if: github.event.inputs.mode != 'test_telegram'
        run: |
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Scraper & Gemini Vision Analyzer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          MODE="${{ github.event.inputs.mode || 'analyze' }}"

          if [ "$MODE" = "test_telegram" ]; then
            python main.py --test-telegram
          elif [ "$MODE" = "mark_existing_seen" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
              python main.py --headful --mark-existing-seen
          else
            xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
              python main.py --headful --only-today --limit "$LIMIT"
          fi

      - name: Save updated seen_lots.json and passed_cars to repository
        if: always() && github.event.inputs.mode != 'test_telegram'
        run: |
          cp seen_lots.json /tmp/seen_lots_run.json
          cp passed_cars.json /tmp/passed_cars_run.json || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python -c '
          import json, pathlib
          from main import render_passed_cars_markdown

          # Merge seen_lots.json
          p_repo = pathlib.Path("seen_lots.json")
          p_run = pathlib.Path("/tmp/seen_lots_run.json")
          s_repo = set(json.loads(p_repo.read_text())) if p_repo.exists() else set()
          s_run = set(json.loads(p_run.read_text())) if p_run.exists() else set()
          merged = sorted(s_repo | s_run)
          p_repo.write_text(json.dumps(merged, indent=2) + "\n")

          # Merge passed_cars.json and regenerate PASSED_CARS.md
          pc_repo = pathlib.Path("passed_cars.json")
          pc_run = pathlib.Path("/tmp/passed_cars_run.json")
          list_repo = json.loads(pc_repo.read_text()) if pc_repo.exists() else []
          list_run = json.loads(pc_run.read_text()) if pc_run.exists() else []
          seen_keys = set()
          combined = []
          for item in list_run + list_repo:
              key = f"{str(item.get(\"source\", \"\")).lower()}:{item.get(\"lot_id\", \"\")}"
              if key not in seen_keys:
                  seen_keys.add(key)
                  combined.append(item)
          pc_repo.write_text(json.dumps(combined, indent=2, ensure_ascii=False) + "\n")
          render_passed_cars_markdown(combined, "PASSED_CARS.md")
          '
          git add seen_lots.json passed_cars.json PASSED_CARS.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update seen_lots.json and passed_cars [skip ci]"
            git push origin HEAD:main
          else
            echo "Brak nowych wpisów w seen_lots.json / passed_cars.json"
          fi
